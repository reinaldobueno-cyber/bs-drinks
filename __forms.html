<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Forms skeleton — B.S Drinks</title>
</head>
<body>
  <!-- Skeleton for Netlify Forms detection (JS-rendered form on index) -->
  <form name="propostas" method="POST" data-netlify="true" netlify-honeypot="bot-field" hidden>
    <input type="hidden" name="form-name" value="propostas" />
    <input name="bot-field" />
    <input name="nome" type="text" />
    <input name="whatsapp" type="text" />
    <input name="tipoEvento" type="text" />
    <input name="dataEvento" type="text" />
    <input name="horario" type="text" />
    <input name="duracao" type="text" />
    <input name="convidados" type="text" />
    <input name="local" type="text" />
    <input name="cidade" type="text" />
    <input name="bairro" type="text" />
    <input name="tipoBebidas" type="text" />
    <input name="destilados" type="text" />
    <input name="outrasBebidas" type="text" />
    <input name="cardapioClassicos" type="text" />
    <input name="cardapioFrutados" type="text" />
    <input name="cardapioEspeciais" type="text" />
    <input name="cardapioSemAlcool" type="text" />
    <input name="drinksSelecionados" type="text" />
    <input name="totalOpcoes" type="text" />
    <input name="preferBS" type="text" />
    <input name="bancada" type="text" />
    <input name="copos" type="text" />
    <textarea name="observacoes"></textarea>
    <textarea name="resumoCompleto"></textarea>
  </form>
</body>
</html>
